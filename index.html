<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2447a8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plano de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de até 720px, abas fixas no topo, listas de tarefas com faixa lateral por bloco do edital */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#16202e; --muted:#5b6778; --line:#d5dbe6;
  --accent:#2447a8; --accent-ink:#ffffff; --soft:#e3e9f8;
  --ok:#1c7a4c; --warn:#a36400; --crit:#b3261e; --crit-soft:#fbe9e7;
  --c0:#2447a8; --c1:#8a3a86; --c2:#0f7a7a; --c3:#a8562a; --c4:#4f6b1f; --c5:#a02c58;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151d; --surface:#1a212c; --ink:#e8ecf3; --muted:#9aa6b8; --line:#2e3847;
    --accent:#8fa9f5; --accent-ink:#0d1524; --soft:#232d42;
    --ok:#5ec690; --warn:#e3a84a; --crit:#f08a80; --crit-soft:#3a1f1d;
    --c0:#8fa9f5; --c1:#d08bcc; --c2:#5cc4c4; --c3:#e0a17c; --c4:#a9c56d; --c5:#f08fb4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151d; --surface:#1a212c; --ink:#e8ecf3; --muted:#9aa6b8; --line:#2e3847;
  --accent:#8fa9f5; --accent-ink:#0d1524; --soft:#232d42;
  --ok:#5ec690; --warn:#e3a84a; --crit:#f08a80; --crit-soft:#3a1f1d;
  --c0:#8fa9f5; --c1:#d08bcc; --c2:#5cc4c4; --c3:#e0a17c; --c4:#a9c56d; --c5:#f08fb4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 88px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0;text-wrap:balance}
.sync{all:unset;cursor:pointer;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 0}
.sync:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--warn)}
.top{position:sticky;top:0;z-index:5;background:var(--bg)}
nav{padding:8px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{font:inherit;font-weight:500;font-size:.9rem;padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.crit{border-color:var(--crit);background:var(--crit-soft)}
.card.note{border-color:var(--accent);background:var(--soft)}
.big{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--body);font-weight:400;font-size:.95rem;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok i{background:var(--ok)}
.bar.bad i{background:var(--crit)}
.perf{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.9rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.9rem}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--k,var(--line));border-radius:8px;padding:10px 12px}
.k0{--k:var(--c0)}.k1{--k:var(--c1)}.k2{--k:var(--c2)}.k3{--k:var(--c3)}.k4{--k:var(--c4)}.k5{--k:var(--c5)}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);margin:0;cursor:pointer}
.task label{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.task .sub{font-size:.78rem;color:var(--muted);font-weight:500}
.task .ti{overflow-wrap:anywhere}
.task.done .ti{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.8rem}
.chip{padding:2px 8px;border-radius:999px;font-weight:600;font-size:.72rem;border:1px solid var(--line);white-space:nowrap}
.chip.p{background:var(--soft);color:var(--accent);border-color:transparent}
.chip.r{background:transparent;color:var(--warn);border-color:var(--warn)}
.chip.q{background:transparent;color:var(--c2);border-color:var(--c2)}
.chip.s{background:transparent;color:var(--c3);border-color:var(--c3)}
.iv.iv4{grid-template-columns:repeat(3,1fr) auto}
.chip.late{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ord{display:flex;gap:4px}
.iv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
textarea{font:inherit;font-size:.8rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:90px;resize:vertical}
.btn[disabled]{opacity:.4;cursor:default}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.tog b{font-family:var(--display);font-weight:700;font-size:1.1rem}
.tog span{color:var(--muted);font-size:1.2rem;line-height:1}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.min{color:var(--muted);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.btn{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.day{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.day span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.subj{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.subj:first-of-type{border-top:0;padding-top:0}
.subj-top{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.pick{width:22px;height:22px;margin:0 4px;accent-color:var(--crit);cursor:pointer}
.grip{touch-action:none;cursor:grab;color:var(--muted);font-size:1.2rem;padding:6px 4px;user-select:none;-webkit-user-select:none}
.subj.dragging{opacity:.45}
.badge.low{border-color:var(--crit);color:var(--crit)}
.subj-h{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;min-width:0}
.subj-info{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sw{width:10px;height:10px;border-radius:3px;background:var(--k,var(--muted))}
.subj-h b{font-weight:600}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.topic{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.topic span{overflow-wrap:anywhere;min-width:0}
.st{color:var(--muted);font-size:.78rem;white-space:nowrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=url],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.hours{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hours .field{text-align:center}
.hours input{padding:9px 2px;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task.g{grid-template-columns:auto 1fr auto auto}
.task .score{grid-column:1/-1;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.grp,.kids{display:flex;flex-direction:column;gap:6px}
.kids{padding-left:14px}
.clock{font-weight:600;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:1px solid var(--line);border-radius:8px;font-size:.72rem;color:var(--muted);min-width:0;font-variant-numeric:tabular-nums}
.wd.now{border-color:var(--accent);background:var(--soft)}
.wd b{color:var(--ink);font-size:.95rem}
.wb{width:14px;height:44px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.wb i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.bcol .b{width:100%;max-width:28px;min-height:2px;background:var(--accent);border-radius:4px 4px 0 0}
#undo{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:10;font-size:.9rem;max-width:calc(100% - 32px);white-space:nowrap}
#undo .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
#pomo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:8px 12px;margin-bottom:8px;border-radius:8px;background:var(--soft);border:1px solid var(--accent);font-size:.9rem;animation:pomo-in .8s ease}
#pomo b{font-variant-numeric:tabular-nums}
@keyframes pomo-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#pomo{animation:none}}
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,14,22,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal .card{width:100%;max-width:380px}
[hidden]{display:none!important}
@media (max-width:420px){.form{grid-template-columns:1fr}.hours{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Plano de Estudos</h1>
      <div class="muted" id="course"></div>
    </div>
    <button type="button" class="sync" id="sync" aria-label="Sincronização"><span class="dot"></span><span>Salvo neste aparelho</span></button>
  </header>
  <div class="top">
  <nav id="nav" aria-label="Seções">
    <button type="button" data-tab="hoje">Hoje</button>
    <button type="button" data-tab="cronograma">Cronograma</button>
    <button type="button" data-tab="materias">Matérias</button>
    <button type="button" data-tab="ajustes">Ajustes</button>
  </nav>
  <div id="pomo" role="status" hidden></div>
  </div>
  <main id="app"></main>
</div>
<div id="modal" hidden></div>
<div id="undo" role="status" hidden><span>Alteração salva.</span><button type="button" class="btn sm" id="undo-btn">Desfazer</button></div>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
